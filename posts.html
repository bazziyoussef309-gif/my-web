<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="matrix"></canvas>

<nav>
  <div class="logo glitch">CYBER SITE</div>

  <div class="menu-toggle" onclick="toggleMenu()">☰</div>

  <ul id="menu">
    <li><a href="posts.html">Posts</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="terminal.html">Terminal</a></li>
  </ul>
</nav>

<div class="container">

  <textarea id="postText" placeholder="Write a post"></textarea>

  <button onclick="addPost()">Publish</button>

  <div class="post">
    <img src="photo.jbg.jpeg">

    <h3>First Post 🔥</h3>

    <p>This is my cyber styled post system.</p>

    <button onclick="like(this)">
      ❤️ Like <span>0</span>
    </button>
  </div>

  <div class="post">
    <img src="photo.jbg.jpeg">

    <h3>Hacking Vibes 💻</h3>

    <p>Matrix style website building.</p>

    <button onclick="like(this)">
      ❤️ Like <span>0</span>
    </button>
  </div>

  <div class="post">
    <img src="Heyvphoto.jbg.jpeg">

    <h3>Cyber World 🌐</h3>

    <p>Learning HTML CSS and JavaScript.</p>

    <button onclick="like(this)">
      ❤️ Like <span>0</span>
    </button>
  </div>

</div>

<script>
function toggleMenu(){
  document.getElementById("menu").classList.toggle("active");
}

function like(btn){
  let span = btn.querySelector("span");

  if(span){
    let count = parseInt(span.innerText);
    count++;
    span.innerText = count;
  }
}

function addPost(){

  let text = document.getElementById("postText").value;

  if(text.trim() === "") return;

  let post = document.createElement("div");

  post.className = "post";

  post.innerHTML = `
    <h3>New Post 🚀</h3>
    <p>${text}</p>
    <button onclick="like(this)">
      ❤️ Like <span>0</span>
    </button>
  `;

  document.querySelector(".container").appendChild(post);

  document.getElementById("postText").value = "";
}
</script>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const matrix = letters.split("");

const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];

for(let x = 0; x < columns; x++){
  drops[x] = 1;
}

function draw(){

  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#00ff00";
  ctx.font = fontSize + "px monospace";

  for(let i = 0; i < drops.length; i++){

    const text = matrix[Math.floor(Math.random()*matrix.length)];

    ctx.fillText(text,i*fontSize,drops[i]*fontSize);

    if(drops[i]*fontSize > canvas.height){
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(draw,35);
</script>

</body>
</html>
