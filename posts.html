<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const matrix = letters.split("");

const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];

for(let x = 0; x < columns; x++){
  drops[x] = 1;
}

function draw(){

  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#00ff00";
  ctx.font = fontSize + "px monospace";

  for(let i = 0; i < drops.length; i++){

    const text = matrix[Math.floor(Math.random()*matrix.length)];

    ctx.fillText(text,i*fontSize,drops[i]*fontSize);

    if(drops[i]*fontSize > canvas.height){
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(draw,35);
</script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  window.addPost = async function(){

  let text = document.getElementById("postText").value;

  if(text.trim() === "") return;

  await addDoc(postsRef,{
    text:text
  });

  document.getElementById("postText").value = "";

  loadPosts();
}

async function loadPosts(){

  const snapshot = await getDocs(postsRef);

  document.querySelectorAll(".firebase-post").forEach(p => p.remove());

  snapshot.forEach(doc => {

    const data = doc.data();

    const post = document.createElement("div");

    post.className = "post firebase-post";

    post.innerHTML = `
      <h3>New Post 🚀</h3>
      <p>${data.text}</p>
    `;

    document.querySelector(".container").appendChild(post);
  });
}

loadPosts();

async function loadLikes(){
  const snap = await getDoc(postRef);

  if(snap.exists()){
    document.getElementById("likes").innerText =
      snap.data().count + " Likes";
  }
}

window.likePost = async function(){

  await updateDoc(postRef,{
    count: increment(1)
  });

  loadLikes();
};

loadLikes();

</script>
