<!DOCTYPE html>

<html>

<head>

<title>Posts</title>

<style>

body{
  background:#000;
  color:#00ff88;
  font-family:monospace;
  padding:30px;
}

h1{
  text-align:center;
  margin-bottom:40px;
}

.post{
  background:#111;
  border:1px solid #00ff88;
  padding:20px;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 0 20px #00ff88;
}

button{
  background:#00ff88;
  border:none;
  padding:10px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  transform:scale(1.05);
}

</style>

</head>

<body>

<h1>CYBER POSTS 🔥</h1>
<input id="postInput" placeholder="Write a post..."
style="padding:10px;width:300px;border-radius:10px;">

<button onclick="addPost()">Add Post 🔥</button>

<br><br>
<div class="post">

<h2>Post #1</h2>

<p>
Today I connected Firebase with my website 😎
</p>

<button>Like ❤️</button>

</div>

<div class="post">

<h2>Post #2</h2>

<p>
Cyber security + Web Development journey 🔥
</p>

<button>Like ❤️</button>

</div>
<script>

function addPost(){

let text = document.getElementById("postInput").value;

let post = document.createElement("div");

post.className = "post";

post.innerHTML = `
<h2>New Post 😎</h2>
<p>${text}</p>
<button>Like ❤️</button>
`;

document.body.appendChild(post);

}

</script>
</body>

</html>
