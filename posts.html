<!DOCTYPE html>

<html>

<head>

<title>Posts</title>

<style>

body{
  background:#000;
  color:#00ff88;
  font-family:monospace;
  padding:30px;
}

h1{
  text-align:center;
  margin-bottom:40px;
}

.post{
  background:#111;
  border:1px solid #00ff88;
  padding:20px;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 0 20px #00ff88;
}

button{
  background:#00ff88;
  border:none;
  padding:10px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  transform:scale(1.05);
}

</style>

</head>

<body>

<h1>CYBER POSTS 🔥</h1>
<input id="postInput" placeholder="Write a post..."
style="padding:10px;width:300px;border-radius:10px;">

<button onclick="addPost()">Add Post 🔥</button>

<br><br>
<div class="post">

<h2>Post #1</h2>

<p>
Today I connected Firebase with my website 😎
</p>
<button onclick="like1()">Like ❤️</button>
<span id="likes1">0</span>

<br><br>

<input type="text" id="comment1" placeholder="Write a comment">

<button id="commentBtn">Comment</button>

<p id="comments1"></p>
</div>

<div class="post">

<h2>Post #2</h2>

<p>
Cyber security + Web Development journey 🔥
</p>

<button onclick="like2()">Like ❤️ <span id="likes2">0</span></button>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {

apiKey: "AIzaSyBs1bbPn87Pp6H11ZFYXQui7LA55V3Mc0g",

authDomain: "youssefcyber-39505.firebaseapp.com",

projectId: "youssefcyber-39505",

storageBucket: "youssefcyber-39505.firebasestorage.app",

messagingSenderId: "651749790484",

appId: "1:651749790484:web:b85831fd2aae673144e801"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

function addPost(){

let text = document.getElementById("postInput").value;

let post = document.createElement("div");

post.className = "post";

post.innerHTML = `
<h2>New Post 😎</h2>
<p>${text}</p>
`;

document.body.appendChild(post);

}

let count1 = 0;
let count2 = 0;

function like1() {

count1++;

document.getElementById("likes1").innerText = count1;

}

function like2() {

count2++;

document.getElementById("likes2").innerText = count2;

}

async function addComment1() {
alert("WORKING");
  let text = document.getElementById("comment1").value;

  try {

    await addDoc(collection(db, "comments"), {
      text: text
    });

    console.log("saved!");

    document.getElementById("comment1").value = "";

    loadComments();

  } catch (e) {

    console.error(e);

  }
}

}

async function loadComments() {

document.getElementById("comments1").innerHTML = "";

const querySnapshot = await getDocs(collection(db, "comments"));

querySnapshot.forEach((doc) => {

document.getElementById("comments1").innerHTML += doc.data().text + "<br>";

});

}

loadComments();
window.onload = function () {

  document.getElementById("commentBtn").addEventListener("click", addComment1);

};
</script>
</body>

</html>
