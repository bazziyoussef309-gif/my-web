<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  font-family: monospace;
  background:black;
  color:#00ff9d;
  padding-top:80px;
}

/* posts container */
.container{
  width:90%;
  max-width:600px;
  margin:auto;
}

/* card */
.post{
  border:1px solid #00ff9d;
  margin-bottom:20px;
  padding:10px;
  background:rgba(0,0,0,0.6);
  box-shadow:0 0 10px #00ff9d;
  animation: fade 0.6s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.post img{
  width:100%;
  border:1px solid #00ff9d;
}

.post h3{
  margin:10px 0 5px;
}

.post p{
  font-size:14px;
}

/* like button */
button{
  background:black;
  border:1px solid #00ff9d;
  color:#00ff9d;
  padding:5px 10px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  box-shadow:0 0 10px #00ff9d;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">CYBER SITE</div>

  <div class="menu-toggle" onclick="toggleMenu()">☰</div>

  <ul id="menu">
    <li><a href="posts.html">Posts</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="terminal.html">Terminal</a></li>
  </ul>
</nav>
<div style="padding:20px;">

  <div style="border:1px solid #00ff9d; margin-bottom:20px; padding:10px;">
    <h3>First Post 🔥</h3>
    <p>This is my cyber website.</p>
    <button>❤️ Like</button>
  </div>

  <div style="border:1px solid #00ff9d; margin-bottom:20px; padding:10px;">
    <h3>Hacking Vibes 💻</h3>
    <p>Matrix style UI working.</p>
    <button>❤️ Like</button>
  </div>

</div>  

<!-- POSTS -->
<div class="container">

  <div class="post">
    <img src="https://via.placeholder.com/600x300">
    <h3>First Post 🔥</h3>
    <p>This is my cyber styled post system.</p>
    <button onclick="like(this)">❤️ Like</button>
  </div>

  <div class="post">
    <img src="https://via.placeholder.com/600x300">
    <h3>Hacking Vibes 💻</h3>
    <p>Matrix style website building.</p>
    <button onclick="like(this)">❤️ Like</button>
  </div>

</div>

<script>
function toggleMenu(){
  document.getElementById("menu").classList.toggle("active");
}

function like(btn){
  if(btn.innerHTML.includes("❤️")){
    btn.innerHTML = "💚 Liked";
  } else {
    btn.innerHTML = "❤️ Like";
  }
}
</script>

</body>
</html>
