<!DOCTYPE html>
<html>

<head>
  <title>Login System</title>

  <style>
    body{
      background:#000;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      overflow:hidden;
    }

    .login-box{
      background:#111;
      padding:40px;
      border-radius:20px;
      width:320px;
      text-align:center;
      box-shadow:0 0 25px #00ffcc;
    }

    h1{
      color:#00ffcc;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:none;
      border-radius:10px;
      background:#222;
      color:white;
      font-size:16px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#00ffcc;
      color:black;
      font-size:18px;
      cursor:pointer;
      margin-top:15px;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
    }

    p{
      margin-top:15px;
      color:#aaa;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>LOGIN SYSTEM</h1>

    <input type="email" placeholder="Email">

    <input type="password" placeholder="Password">

    <button>LOGIN</button>

    <p>Cyber Secure Access</p>

  </div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBs1bbPn87Pp6H11ZFYXQui7LA55V3Mc0g",
  authDomain: "youssefcyber-39505.firebaseapp.com",
  projectId: "youssefcyber-39505",
  storageBucket: "youssefcyber-39505.firebasestorage.app",
  messagingSenderId: "651749790484",
  appId: "1:651749790484:web:b85831fd2aae673144e801"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const email = document.querySelector('input[type="email"]');
const password = document.querySelector('input[type="password"]');
const button = document.querySelector("button");

button.onclick = () => {

  createUserWithEmailAndPassword(auth, email.value, password.value)

  .then(() => {

  alert("Login Success 🔥");

  window.location.href = "terminal.html";

})

  .catch(() => {

    signInWithEmailAndPassword(auth, email.value, password.value)

    .then(() => {

      alert("Login Success 🔥");

    })

    .catch((error) => {

      alert(error.message);

    });

  });

};

</script>
</body>

</html>
