<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:linear-gradient(-45deg,#0f172a,#1e293b,#0f172a,#1d4ed8);
  background-size:400% 400%;
  animation:bg 10s ease infinite;
  color:white;
  overflow-x:hidden;
}

@keyframes bg{
  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }
}

.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:25px 50px;
  backdrop-filter:blur(10px);
}

.logo{
  font-size:28px;
  font-weight:bold;
  animation:slideDown 1s ease;
}

.menu a{
  color:white;
  text-decoration:none;
  margin-left:20px;
  transition:0.3s;
}

.menu a:hover{
  color:#60a5fa;
}

.hero{
  text-align:center;
  padding:120px 20px;
  animation:fadeIn 2s ease;
}

.hero h1{
  font-size:70px;
  margin-bottom:20px;
}

.hero p{
  font-size:22px;
  color:#cbd5e1;
}

.btn{
  display:inline-block;
  margin-top:30px;
  padding:15px 35px;
  background:#3b82f6;
  border-radius:12px;
  color:white;
  text-decoration:none;
  transition:0.3s;
  box-shadow:0 0 20px #3b82f6;
}

.btn:hover{
  transform:scale(1.1);
  background:#2563eb;
}

.cards{
  display:flex;
  justify-content:center;
  gap:30px;
  padding:50px;
  flex-wrap:wrap;
}

.card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  width:280px;
  padding:35px;
  border-radius:20px;
  transition:0.4s;
  animation:up 1.5s ease;
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
  box-shadow:0 0 25px rgba(59,130,246,0.5);
}

.card h2{
  margin-bottom:15px;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(40px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes up{
  from{
    opacity:0;
    transform:translateY(50px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes slideDown{
  from{
    opacity:0;
    transform:translateY(-30px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}
<Lstyle>
</style>
