<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youssef Site</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">Youssef Site</div>

  <div class="menu-toggle" onclick="toggleMenu()">☰</div>

  <ul id="menu">
    <li><a href="posts.html" onclick="playClick()">Posts</a></li>
    <li><a href="profile.html" onclick="playClick()">Profile</a></li>
    <li><a href="terminal.html" onclick="playClick()">Terminal</a></li>
  </ul>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>WELCOME TO MY CYBER WORLD 😎</h1>

  <p>Future Developer • Cyber Security • Firebase System</p>

  <button onclick="playClick(); enterSystem()">ENTER SYSTEM</button>
</div>

<!-- AUDIO (YOUR FILE) -->
<audio id="clickSound" src="freesound_community-old-radio-button-click-97549 (1).mp3"></audio>

<!-- SCRIPTS -->
<script>
function enterSystem(){
  document.body.innerHTML = `
    <h1 style="
      color:lime;
      font-family:monospace;
      text-align:center;
      margin-top:250px;">
      Accessing System...
    </h1>
  `;

  setTimeout(() => {
    window.location.href = "login.html";
  }, 2000);
}

function toggleMenu(){
  document.getElementById("menu").classList.toggle("active");
}

function playClick(){
  const sound = document.getElementById("clickSound");
  sound.currentTime = 0;
  sound.play();
}
</script>

</body>
</html>
