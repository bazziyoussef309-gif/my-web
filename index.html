<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youssef Cyber World</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:linear-gradient(-45deg,#0f172a,#1e293b,#0f172a,#1d4ed8);
  background-size:400% 400%;
  animation:bg 10s ease infinite;
  color:white;
  overflow-x:hidden;
}

@keyframes bg{
  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }
}

.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:25px 50px;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.menu a{
  color:white;
  text-decoration:none;
  margin-left:20px;
  transition:0.3s;
}

.menu a:hover{
  color:#60a5fa;
}

.hero{
  text-align:center;
  padding:120px 20px;
}

.hero h1{
  font-size:70px;
  margin-bottom:20px;
}

.hero p{
  font-size:22px;
  color:#cbd5e1;
  min-height:30px;
}

.btn{
  display:inline-block;
  margin-top:30px;
  padding:15px 35px;
  background:#3b82f6;
  border-radius:12px;
  color:white;
  text-decoration:none;
  transition:0.3s;
  box-shadow:0 0 20px #3b82f6;
}

.btn:hover{
  transform:scale(1.1);
  background:#2563eb;
}

.cards{
  display:flex;
  justify-content:center;
  gap:30px;
  padding:50px;
  flex-wrap:wrap;
}

.card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  width:280px;
  padding:35px;
  border-radius:20px;
  transition:0.4s;
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
  box-shadow:0 0 25px rgba(59,130,246,0.5);
}

.card h2{
  margin-bottom:15px;
}
#particles-js{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

</style>
</style>
</head>

<body>

<div class="navbar">

  <div class="logo">
    Youssef
  </div>

  <div class="menu">
    <a href="">Home</a>
    <a href="">About</a>
    <a href="">Contact</a>
  </div>

</div>

<div class="hero">

  <h1>
    Youssef Cyber World
  </h1>

  <p id="typing"></p>

  <a href="" class="btn">
    Enter System
  </a>

</div>

<div class="cards">

  <div class="card">
    <h2>Web Design</h2>
    <p>I create modern websites.</p>
  </div>

  <div class="card">
    <h2>Cyber Security</h2>
    <p>Learning networking and ethical hacking.</p>
  </div>

  <div class="card">
    <h2>Projects</h2>
    <p>More projects coming soon.</p>
  </div>

</div>

<script>

const text =
"Web Developer | Cyber Security Learner | Future Hacker";

let i = 0;

function typing(){

  if(i < text.length){

    document.getElementById("typing").innerHTML += text.charAt(i);

    i++;

    setTimeout(typing,70);
  }
}

typing();

</script>
<div id="particles-js"></div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>

particlesJS("particles-js", {

  particles: {

    number: {
      value: 80
    },

    color: {
      value: "#ffffff"
    },

    shape: {
      type: "circle"
    },

    opacity: {
      value: 0.5
    },

    size: {
      value: 3
    },

    move: {
      enable: true,
      speed: 2
    }

  }

});

</script>
</body>
</html>
