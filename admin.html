<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{
  background:black;
  color:lime;
  font-family:monospace;
  padding:20px;
}

h1{
  text-align:center;
}

.card{
  border:1px solid lime;
  padding:15px;
  margin:10px 0;
}

button{
  background:lime;
  color:black;
  border:none;
  padding:8px 12px;
  cursor:pointer;
  margin-top:10px;
}

button:hover{
  box-shadow:0 0 10px lime;
}
</style>
</head>

<body>

<h1>👑 Admin Panel</h1>

<div class="card">
  Posts: <span id="postsCount">0</span>
</div>

<div class="card">
  Comments: <span id="commentsCount">0</span>
</div>

<div id="postsList"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBs1bbPn87Pp6H11ZFYXQui7LA55V3Mc0g",
  authDomain: "youssefcyber-39505.firebaseapp.com",
  projectId: "youssefcyber-39505",
  storageBucket: "youssefcyber-39505.firebasestorage.app",
  messagingSenderId: "651749790484",
  appId: "1:651749790484:web:b85831fd2aae673144e801"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const postsRef = collection(db,"posts");
const commentsRef = collection(db,"comments");

onAuthStateChanged(auth,(user)=>{

  if(!user){
    window.location.href = "login.html";
    return;
  }

  if(user.email !== "bazziyoussef309@gmail.com"){
  window.location.href = "posts.html";
  return;
  }

  loadAdmin();

});

async function loadAdmin(){

  const posts = await getDocs(postsRef);
  const comments = await getDocs(commentsRef);

  document.getElementById("postsCount").innerText =
    posts.size;

  document.getElementById("commentsCount").innerText =
    comments.size;

  const list =
    document.getElementById("postsList");

  list.innerHTML = "";

  posts.forEach((p)=>{

    list.innerHTML += `
      <div class="card">
        <p>${p.data().text}</p>

        <button onclick="deletePost('${p.id}')">
          🗑️ Delete
        </button>
      </div>
    `;

  });

}

window.deletePost = async function(id){

  await deleteDoc(doc(db,"posts",id));

  loadAdmin();

};
  loadAdmin();

</script>

</body>
</html>
