  <script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBs1bbPn87Pp6H11ZFYXQui7LA55V3Mc0g",
  authDomain: "youssefcyber-39505.firebaseapp.com",
  projectId: "youssefcyber-39505",
  storageBucket: "youssefcyber-39505.firebasestorage.app",
  messagingSenderId: "651749790484",
  appId: "1:651749790484:web:b85831fd2aae673144e801"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const postsRef = collection(db,"posts");
const commentsRef = collection(db,"comments");

async function loadAdmin(){

const posts = await getDocs(postsRef);
const comments = await getDocs(commentsRef);

document.getElementById("postsCount").innerText =
posts.size;

document.getElementById("commentsCount").innerText =
comments.size;

const list =
document.getElementById("postsList");

list.innerHTML = "";

posts.forEach((p)=>{

list.innerHTML += `
<div class="card">
${p.data().text}
<button onclick="deletePost('${p.id}')">
Delete
</button>
</div>
`;

});

}

window.deletePost = async function(id){

await deleteDoc(doc(db,"posts",id));

loadAdmin();

}

loadAdmin();

  </script>
