<style>

body{
background:black;
color:white;
font-family:Arial;
margin:0;
padding:0;
}

.header{
padding:20px;
text-align:center;
border-bottom:1px solid lime;
}

.profile{
margin-top:20px;
text-align:center;
}

.profile img{
width:120px;
height:120px;
border-radius:50%;
border:3px solid lime;
}

.username{
font-size:28px;
margin-top:10px;
color:lime;
}

.bio{
color:gray;
margin-top:5px;
}

.story-bar{
display:flex;
overflow-x:auto;
padding:15px;
gap:10px;
}

.story{
min-width:70px;
height:70px;
border-radius:50%;
border:2px solid lime;
display:flex;
align-items:center;
justify-content:center;
color:lime;
}

.posts{
padding:20px;
}

.post{
background:#111;
padding:15px;
margin-bottom:20px;
border-radius:10px;
border:1px solid #333;
}

.post img{
width:100%;
border-radius:10px;
margin-top:10px;
}

button{
background:lime;
border:none;
padding:10px;
margin-top:10px;
cursor:pointer;
font-weight:bold;
}
.story img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 2px solid lime;
}
  .glitch{
  position: relative;
  color: lime;
  font-size: 40px;
  font-weight: bold;
  animation: glitch 1s infinite;
}

@keyframes glitch{
  0%{text-shadow:2px 2px red;}
  25%{text-shadow:-2px -2px blue;}
  50%{text-shadow:2px -2px lime;}
  75%{text-shadow:-2px 2px red;}
  100%{text-shadow:2px 2px blue;}
}
  .fake-terminal{
  width: 80%;
  margin: auto;
  margin-top: 20px;
  background: #111;
  border: 2px solid lime;
  padding: 20px;
  color: lime;
  font-family: monospace;
  box-shadow: 0 0 20px lime;
}

.fake-terminal p{
  animation: glow 1s infinite alternate;
}

@keyframes glow{
  from{
    opacity:0.5;
  }

  to{
    opacity:1;
  }
}
</style>
</head>
