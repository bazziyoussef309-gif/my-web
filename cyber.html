<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Terminal</title>

<style>

body{
background:black;
color:lime;
font-family:monospace;
padding:20px;
overflow:hidden;
}

#terminal{
white-space:pre-line;
font-size:18px;
}

.glow{
text-shadow:0 0 10px lime;
}

</style>
</head>

<body>

<div id="terminal" class="glow"></div>

<script>

const text = `
BOOTING SYSTEM...
LOADING FILES...
CONNECTING DATABASE...
ACCESS GRANTED

WELCOME YOUSSEF 😎

> SYSTEM STATUS: ONLINE
> USERS: 1
> SECURITY: ACTIVE

`;

let i = 0;

function typeWriter(){

if(i < text.length){

document.getElementById("terminal").innerHTML += text.charAt(i);

i++;

setTimeout(typeWriter, 40);

}

}

typeWriter();

</script>

</body>
</html>
